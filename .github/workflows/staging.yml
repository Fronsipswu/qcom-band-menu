name: Staging build

# The optimized (R8, shrunk) staging APK, dev.qcom.bandmenu.staging, for
# every push to diag-test that touches the app.
on:
  push:
    branches: [diag-test]
    paths:
      - 'app/**'
      - '.github/workflows/staging.yml'
  workflow_dispatch:

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staging-apk:
    name: Build staging APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout app repository
        uses: actions/checkout@v4

      - name: Checkout miuix composite build
        uses: actions/checkout@v4
        with:
          repository: compose-miuix-ui/miuix
          ref: e1086564cda9f9019b0cd827c0a29c2de7a91918
          path: miuix

      - name: Checkout AndroidLiquidGlass composite build
        uses: actions/checkout@v4
        with:
          repository: Kyant0/AndroidLiquidGlass
          ref: b18eb0ff12c616546a68c72e7d0097f1ab286c87
          path: AndroidLiquidGlass

      # Reproduces the local composite-build state (see ci.yml for details)
      - name: Patch AndroidLiquidGlass for composite build
        run: |
          sed -i 's/^agp = "9.3.0"$/agp = "9.3.1"/' AndroidLiquidGlass/gradle/libs.versions.toml
          python3 - <<'PYEOF'
          from pathlib import Path
          p = Path("AndroidLiquidGlass/backdrop/build.gradle.kts")
          s = p.read_text()
          old = "}\n\nkotlin {"
          new = "}\n\ngroup = \"io.github.kyant0\"\nversion = \"2.0.0\"\n\nkotlin {"
          assert s.count(old) >= 1, "insertion point not found in backdrop/build.gradle.kts"
          p.write_text(s.replace(old, new, 1))
          PYEOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "build-tools;37.0.0"
          sdkmanager --install "platforms;android-37.0" || \
            echo "::warning::platforms;android-37.0 not in remote repo - AGP will auto-download it during the build"

      # Staging is signed with the debug key. With the shared one from the
      # secret, CI builds install over local staging builds; without it the
      # runner's throwaway key is used and the APK only installs fresh.
      - name: Install shared debug keystore
        env:
          KEYSTORE: ${{ secrets.STAGING_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$KEYSTORE" | base64 -d > "$HOME/.android/debug.keystore"
          else
            echo "::warning::STAGING_DEBUG_KEYSTORE_BASE64 not set - signed with a throwaway debug key"
          fi

      # diag-test isn't the default branch, so let it write the cache too.
      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build staging APK
        working-directory: app
        run: ./gradlew :app:assembleStaging

      - name: Remove keystore
        if: always()
        run: rm -f "$HOME/.android/debug.keystore"

      - name: Determine version and APK name
        run: |
          VERSION=$(grep -m1 -oP 'versionName = "\K[^"]+' app/app/build.gradle.kts)
          APK="QBM-staging_v${VERSION}-${GITHUB_SHA::7}.apk"
          mv app/app/build/outputs/apk/staging/app-staging.apk "$APK"
          echo "APK=${APK}" >> "$GITHUB_ENV"

      # The signing certificate's fingerprint (public), also in the run's
      # summary: it matches the local debug key's when the secret was used.
      - name: Show signing certificate
        run: |
          CERT=$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$APK" | grep -m1 'SHA-256 digest')
          echo "$CERT"
          echo "Signing certificate SHA-256: ${CERT##*: }" >> "$GITHUB_STEP_SUMMARY"

      # Unzipped: the artifact downloads as the .apk itself (named after the file).
      - name: Upload staging APK artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.APK }}
          archive: false
          retention-days: 30
          if-no-files-found: error

      # After the upload, so a failing test still leaves the APK.
      - name: Run unit tests
        working-directory: app
        run: ./gradlew :app:testDebugUnitTest
