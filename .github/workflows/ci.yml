name: CI build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout app repository
        uses: actions/checkout@v4

      - name: Checkout miuix composite build
        uses: actions/checkout@v4
        with:
          repository: compose-miuix-ui/miuix
          ref: e1086564cda9f9019b0cd827c0a29c2de7a91918
          path: miuix

      - name: Checkout AndroidLiquidGlass composite build
        uses: actions/checkout@v4
        with:
          repository: Kyant0/AndroidLiquidGlass
          ref: b18eb0ff12c616546a68c72e7d0097f1ab286c87
          path: AndroidLiquidGlass

      # Reproduces the local composite-build state:
      # 1. backdrop module needs group/version coordinates for composite-build
      #    dependency substitution (io.github.kyant0:backdrop)
      # 2. AGP bumped 9.3.0 -> 9.3.1 to match the app's AGP version
      - name: Patch AndroidLiquidGlass for composite build
        run: |
          sed -i 's/^agp = "9.3.0"$/agp = "9.3.1"/' AndroidLiquidGlass/gradle/libs.versions.toml
          python3 - <<'PYEOF'
          from pathlib import Path
          p = Path("AndroidLiquidGlass/backdrop/build.gradle.kts")
          s = p.read_text()
          old = "}\n\nkotlin {"
          new = "}\n\ngroup = \"io.github.kyant0\"\nversion = \"2.0.0\"\n\nkotlin {"
          assert s.count(old) >= 1, "insertion point not found in backdrop/build.gradle.kts"
          p.write_text(s.replace(old, new, 1))
          PYEOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-37" "build-tools;37.0.0"

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK and run unit tests
        working-directory: app
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest

      - name: Determine version and APK name
        run: |
          VERSION=$(grep -m1 -oP 'versionName = "\K[^"]+' app/app/build.gradle.kts)
          APK="qcom-band-menu_v${VERSION}_debug-${GITHUB_SHA::7}.apk"
          mv app/app/build/outputs/apk/debug/app-debug.apk "$APK"
          echo "APK=${APK}" >> "$GITHUB_ENV"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK }}
          path: ${{ env.APK }}
          if-no-files-found: error
